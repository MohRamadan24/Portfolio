name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Image Tag
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
          -u "${{ secrets.DOCKERHUB_USERNAME }}" \
          --password-stdin

      - name: Build Image
        run: |
          docker build \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/portfolio:latest \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/portfolio:${{ env.IMAGE_TAG }} \
          .

      - name: Push Latest
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/portfolio:latest

      - name: Push Commit Tag
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/portfolio:${{ env.IMAGE_TAG }}
